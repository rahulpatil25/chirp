name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    env:
      # Placeholders only. Nothing here reaches a real service: no page is prerendered at build
      # time, so the build never calls Clerk or opens the database. `db:push` creates a throwaway
      # SQLite file so that `prisma generate` and the build agree on the schema.
      DATABASE_URL: "file:./ci.db"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
      CLERK_SECRET_KEY: "sk_test_0000000000000000000000000000000000000000"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create database
        run: npm run db:push

      - name: Check formatting
        run: npm run format:check

      - name: Type checking
        run: npm run typecheck

      - name: Linting
        run: npm run lint

      - name: Build
        run: npm run build
